<h1>Acervo de Livros</h1>
<ul>
    {% for livro in livros %}
        <li>
            <a href="{% url 'acervo:detalhe_livro' livro.pk %}">{{ livro.titulo }}</a> - {{ livro.editora }}
        </li>
    {% empty %}
        <li>Nenhum livro cadastrado.</li>
    {% endfor %}
</ul>
<a href="{% url 'acervo:lista_autores' %}">Ver Lista de Autores</a>
